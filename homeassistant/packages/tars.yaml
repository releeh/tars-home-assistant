# =====================================================================
# TARS for Home Assistant: helpers, sensors, scripts and automations.
#
# Install: put this file in /config/packages/ and add to configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# then restart Home Assistant. See docs/SETUP.md for the full walkthrough.
#
# Entity IDs assume:
#   - your ESP32-S3-BOX-3 is flashed with esphome/tars-box.yaml
#     (friendly name "TARS Box", so entities start with "tars_box")
#   - your Claude conversation agent is named "TARS"  -> conversation.tars
#   - two voice pipelines named "TARS" and "TARS (Claude only)"
#   - two local to-do lists named "TARS Journal" and "TARS Forgotten Memories"
# If you named anything differently, find-and-replace below.
# =====================================================================

input_number:
  tars_humor_setting:
    name: TARS humor setting
    min: 0
    max: 100
    step: 1
    initial: 60
    unit_of_measurement: "%"
    icon: mdi:emoticon-devil-outline
  tars_honesty_setting:
    name: TARS honesty setting
    min: 0
    max: 100
    step: 1
    initial: 90
    unit_of_measurement: "%"
    icon: mdi:scale-balance
  tars_est_cost_per_reply:
    name: TARS est cost per reply
    min: 0.5
    max: 20
    step: 0.5
    initial: 4
    unit_of_measurement: "¢"
    icon: mdi:cash-edit

# NOTE: "initial" above resets these on every restart. Once you've settled on
# your levels, delete the three "initial:" lines so Home Assistant restores the
# last value instead.

input_boolean:
  tars_conversation_mode:
    name: TARS conversation mode
    icon: mdi:forum-outline
  tars_conversation_ended:
    name: TARS conversation ended
    icon: mdi:hand-wave
  tars_handle_simple_commands_locally:
